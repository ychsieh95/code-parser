<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#2b2d42"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00a87e"/>
    </linearGradient>
    <linearGradient id="blurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7289da"/>
      <stop offset="100%" style="stop-color:#5b6eae"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="radial" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#7289da;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#7289da;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="100" ry="100" fill="url(#radial)"/>

  <!-- Film strip - left, tall -->
  <g opacity="0.82" filter="url(#shadow)" transform="translate(24, 72)">
    <rect x="0" y="0" width="140" height="356" rx="10" fill="#0d0e1a"/>
    <rect x="0" y="0" width="140" height="356" rx="10" fill="none" stroke="#7289da" stroke-width="3"/>
    <!-- Perforations top -->
    <rect x="10" y="10" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="36" y="10" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="62" y="10" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="88" y="10" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="114" y="10" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <!-- Perforations bottom -->
    <rect x="10" y="332" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="36" y="332" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="62" y="332" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="88" y="332" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <rect x="114" y="332" width="18" height="14" rx="3" fill="#7289da" opacity="0.7"/>
    <!-- Frame 1 -->
    <rect x="12" y="34" width="116" height="92" rx="4" fill="#13141f"/>
    <polygon points="50,58 50,102 94,80" fill="#7289da" opacity="0.6"/>
    <!-- Frame 2 -->
    <rect x="12" y="136" width="116" height="92" rx="4" fill="#13141f"/>
    <polygon points="50,160 50,204 94,182" fill="#7289da" opacity="0.5"/>
    <!-- Frame 3 -->
    <rect x="12" y="238" width="116" height="84" rx="4" fill="#13141f"/>
    <polygon points="50,260 50,302 94,281" fill="#7289da" opacity="0.4"/>
  </g>

  <!-- Comic book - right, upper area -->
  <g opacity="0.82" filter="url(#shadow)" transform="translate(334, 72)">
    <!-- Shadow pages -->
    <rect x="0" y="0" width="154" height="210" rx="5" fill="#1a0a2e" transform="rotate(7, 77, 105)"/>
    <rect x="0" y="0" width="154" height="210" rx="5" fill="#220d3a" transform="rotate(3.5, 77, 105)"/>
    <!-- Main cover -->
    <rect x="0" y="0" width="154" height="210" rx="5" fill="#13141f" stroke="#00d4aa" stroke-width="3"/>
    <!-- Spine -->
    <rect x="0" y="0" width="14" height="210" rx="5" fill="#00d4aa" opacity="0.85"/>
    <!-- Panels -->
    <rect x="20" y="12" width="124" height="66" rx="3" fill="#0d0e1a"/>
    <rect x="20" y="86" width="58" height="110" rx="3" fill="#0d0e1a"/>
    <rect x="84" y="86" width="60" height="110" rx="3" fill="#0d0e1a"/>
    <!-- Star burst -->
    <polygon points="130,44 135,32 140,44 152,39 145,50 158,56 145,56 145,68 135,62 130,74 130,62 118,56 130,56" fill="#febc2e" opacity="0.78"/>
  </g>

  <!-- Magnifying glass - center dominant -->
  <g filter="url(#glow)" transform="translate(256, 215)">
    <circle cx="0" cy="0" r="115" fill="#1a1b2e" fill-opacity="0.92" stroke="url(#tealGrad)" stroke-width="14"/>
    <!-- Inner shine -->
    <circle cx="-28" cy="-28" r="26" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.07"/>
    <!-- Handle -->
    <line x1="82" y1="82" x2="126" y2="126" stroke="url(#tealGrad)" stroke-width="20" stroke-linecap="round"/>
    <!-- Code tag inside glass -->
    <rect x="-80" y="-22" width="160" height="44" rx="9" fill="#0d0e1a" stroke="url(#blurpleGrad)" stroke-width="3.5"/>
    <circle cx="-68" cy="0" r="7" fill="url(#blurpleGrad)"/>
    <text x="4" y="8" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="bold" fill="url(#blurpleGrad)" text-anchor="middle" letter-spacing="1">ABC-123</text>
  </g>

  <!-- URL link - bottom center -->
  <g filter="url(#glow)" transform="translate(256, 438)">
    <rect x="-152" y="-26" width="304" height="52" rx="12" fill="#0d0e1a" stroke="url(#blurpleGrad)" stroke-width="3"/>
    <!-- Link icon (two chain links) -->
    <rect x="-140" y="-10" width="18" height="20" rx="5" fill="none" stroke="url(#blurpleGrad)" stroke-width="2.5"/>
    <rect x="-128" y="-10" width="18" height="20" rx="5" fill="none" stroke="url(#blurpleGrad)" stroke-width="2.5"/>
    <!-- URL text -->
    <text x="4" y="8" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="url(#blurpleGrad)" text-anchor="middle" letter-spacing="1" text-decoration="underline">https://...</text>
  </g>
</svg>
